services:
  # Main PHP Web Application
  - type: web
    name: moodifyme-web
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: moodifyme-db
          property: connectionString

# Database
databases:
  - name: moodifyme-db
    databaseName: moodifyme
    user: moodifyme_user
    plan: free
